services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file:
      - ../.env
    volumes:
      - ../runtime/vision-frames:/opt/vision-frames:ro
      - ../runtime/uploads:/app/backend/cache/uploads
    restart: unless-stopped
    expose:
      - "8001"

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "3001:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
